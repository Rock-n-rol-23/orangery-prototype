<script>

'use strict';
/*<pure>*/
/* Расчётная логика без побочных действий. Блок не обращается ни к чему снаружи себя: тесты вынимают его из файла (tests/pure.mjs). */
const PURE=(()=>{
  const num=v=>{v=Math.floor(+v);return Number.isFinite(v)&&v>0?v:0;};
  const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
  const obj=o=>!!o&&typeof o==='object'&&!Array.isArray(o);
  const clone=o=>JSON.parse(JSON.stringify(o));
  /* запись игрока приводится к известному виду; всё непонятное отбрасывается */
  function clean(r){
    if(!obj(r)||r.v!==1)return null;
    const herb={c:{},n:[]};
    if(obj(r.herb)&&obj(r.herb.c)){
      Object.keys(r.herb.c).forEach(k=>{const v=num(r.herb.c[k]);if(v>0)herb.c[k]=v;});
      if(Array.isArray(r.herb.n))herb.n=r.herb.n.filter((k,i,a)=>typeof k==='string'&&herb.c[k]&&a.indexOf(k)===i);
    }
    const streak=obj(r.streak)&&isDate(r.streak.last)?{last:r.streak.last,n:num(r.streak.n)}:null;
    const daily=obj(r.daily)&&isDate(r.daily.date)?{date:r.daily.date,done:!!r.daily.done,run:obj(r.daily.run)?clone(r.daily.run):null,result:obj(r.daily.result)?clone(r.daily.result):null}:null;
    /* какие карточки ступеней игрок уже видел; null значит «записи ещё нет» (её не было до появления ступеней) */
    const seen=Array.isArray(r.seen)?[2,3,4,5].filter(n=>r.seen.indexOf(n)>=0):null;
    return {v:1,ts:num(r.ts),best:num(r.best),herb,daily,streak,run:obj(r.run)?clone(r.run):null,mode:r.mode==='daily'?'daily':'free',tut:!!r.tut,seen};
  }
  /* местная и облачная копии сливаются по частям: рекорд больший, гербарий объединяется, серия и семя по дате, забег от более свежей копии */
  function mergeSaves(local,cloud,okRun){
    const a=clean(local),b=clean(cloud);
    if(!b)return a;
    if(!a)return b;
    const fresh=b.ts>a.ts?b:a,herb={c:{},n:[]};
    /* негодный забег более свежей копии не заменяет рабочий забег другой копии */
    const runOf=okRun&&fresh.run&&!okRun(fresh.run)?(fresh===a?b:a):fresh;
    [a,b].forEach(r=>Object.keys(r.herb.c).forEach(k=>{herb.c[k]=Math.max(herb.c[k]||0,r.herb.c[k]);}));
    [a,b].forEach(r=>r.herb.n.forEach(k=>{if(herb.n.indexOf(k)<0)herb.n.push(k);}));
    let streak=a.streak||b.streak;
    if(a.streak&&b.streak)streak=b.streak.last>a.streak.last||(b.streak.last===a.streak.last&&b.streak.n>a.streak.n)?b.streak:a.streak;

  puff(i){const x=mx(i),y=my(i)+24;for(let k=0;k<NN(6);k++)emit({t:'dust',img:sprite('dust',true),x:x+(grnd()-.5)*26,y,vx:(grnd()-.5)*46,vy:-8-grnd()*14,r:5+grnd()*4,life:.45+grnd()*.2,a:.5});},
  /* светящийся след от растения, которое летит в точку слияния */
  trail(k,i,sp,dur){const n=NN(7);for(let j=0;j<n;j++){const q=j/n;emit({t:'glow',img:sprite(sp),x:mx(k)+(mx(i)-mx(k))*q+(grnd()-.5)*8,y:my(k)+(my(i)-my(k))*q+(grnd()-.5)*8,r:7-q*3,life:.32,age:-q*dur,a:.8});}},
  /* удар: вспышка, кольцо, лепестки с гравитацией, искры. power от 1 до 3 */
  hit(i,sp,power){
    const x=mx(i),y=my(i)-4;
    emit({t:'flash',img:sprite('white'),x,y,r:46+power*26,life:.3+power*.06,a:.85});

    emit({t:'ring',col:tok(sp),x,y,r0:14,r1:58+power*34,lw:3+power,life:.42+power*.08,a:.9});
    for(let k=0;k<NN(8+power*6);k++){const a=grnd()*6.2832,v=70+grnd()*(90+power*50);
      emit({t:'petal',col:tok(k%3?sp:k%2?'white':sp+'2'),x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-70,g:330,drag:.975,w:3+grnd()*2.4,rot:grnd()*6,vr:(grnd()-.5)*12,fl:6+grnd()*8,life:.75+grnd()*.5,a:.95});}
    for(let k=0;k<NN(6+power*4);k++){const a=grnd()*6.2832,v=50+grnd()*150;
      emit({t:'glow',img:sprite(k%2?'white':sp),x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:60,drag:.94,r:4+grnd()*4,life:.35+grnd()*.35,a:.9});}
  },
  /* искры поднимаются по всей грядке: лотос или новый уровень цветения */
  rise(n){for(let k=0;k<NN(n);k++)emit({t:'glow',img:sprite(k%3?'gold':'white'),x:20+grnd()*350,y:300+grnd()*380,vx:(grnd()-.5)*20,vy:-40-grnd()*70,g:-12,drag:.99,r:4+grnd()*5,life:1.2+grnd(),age:-grnd()*.5,a:.85});}
};
const buzz=v=>{try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(v);}catch(e){}};

/* ---------- звук: всё синтезируется на месте, файлов нет ---------- */
const SND=(()=>{
  /* два состояния: 2 звук и музыка, 0 тишина. Прежний средний режим «только звуки» (1) в сохранённых настройках читается как включённый звук */
  let ac=null,B=null,mode=2,musT=0,nextT=0,stepN=0,bed=null;
  try{const m=localStorage.getItem('orangery-snd2');if(m!==null)mode=+m>0?2:0;}catch(e){}
  const hz=m=>440*Math.pow(2,(m-69)/12);
  /* пентатоника от до первой октавы: любые её ноты согласны со всеми аккордами фона */
  const PENTA=[0,2,4,7,9],note=n=>60+PENTA[((n%5)+5)%5]+12*Math.floor(n/5);
  function build(c){
    const m=c.createGain(),comp=c.createDynamicsCompressor();m.gain.value=.8;m.connect(comp);comp.connect(c.destination);
    /* мягкое длинное эхо: затухающий шум без верхов */
    const rev=c.createConvolver(),len=(c.sampleRate*2.6)|0,buf=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let y=0;for(let i=0;i<len;i++){y=y*.72+(Math.random()*2-1)*.28;d[i]=y*Math.pow(1-i/len,3);}}
    rev.buffer=buf;const w=c.createGain();w.gain.value=.5;rev.connect(w);w.connect(m);
    const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const padf=c.createBiquadFilter();padf.type='lowpass';padf.frequency.value=950;padf.connect(m);padf.connect(rev);
    return {c,m,rev,nb,padf,pl:{},deg:7,rest:false};
  }
  /* щипок струны (алгоритм Карплуса и Стронга): звучит как калимба или арфа, считается один раз на ноту */
  function pluckBuf(b,m){
    if(b.pl[m])return b.pl[m];
    const sr=b.c.sampleRate,N=Math.max(2,Math.round(sr/hz(m))),len=(sr*1.9)|0,buf=b.c.createBuffer(1,len,sr),d=buf.getChannelData(0),ring=new Float32Array(N);
    let y=0;for(let k=0;k<2;k++)for(let i=0;i<N;i++){const r=k?ring[i]:Math.random()*2-1;y=y*.5+r*.5;ring[i]=y;}
    let idx=0,pk=0;
    for(let i=0;i<len;i++){const cur=ring[idx],nx=ring[(idx+1)%N];ring[idx]=(cur+nx)*.498;d[i]=cur;if(Math.abs(cur)>pk)pk=Math.abs(cur);idx=(idx+1)%N;}
    const fin=(sr*.003)|0,fout=(len*.3)|0;
    for(let i=0;i<len;i++){let g=1/(pk||1);if(i<fin)g*=i/fin;if(i>len-fout)g*=(len-i)/fout;d[i]*=g;}
    return b.pl[m]=buf;
  }
  function pluck(b,t,m,vol){const s=b.c.createBufferSource(),g=b.c.createGain();s.buffer=pluckBuf(b,m);g.gain.value=vol;s.connect(g);g.connect(b.m);g.connect(b.rev);s.start(t);}
  function bell(b,t,f,vol,dur){
    [[1,1],[2,.3],[3.01,.11]].forEach(h=>{const o=b.c.createOscillator(),g=b.c.createGain(),d=dur/Math.sqrt(h[0]);
      o.type='sine';o.frequency.value=f*h[0];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol*h[1],t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(b.m);g.connect(b.rev);o.start(t);o.stop(t+d+.05);});
  }
  function blip(b,t,f0,f1,dur,vol){
    const o=b.c.createOscillator(),g=b.c.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.03);o.connect(g);g.connect(b.m);o.start(t);o.stop(t+dur+.06);
  }
  function hiss(b,t,dur,vol,fc,type){
    const s=b.c.createBufferSource(),f=b.c.createBiquadFilter(),g=b.c.createGain();s.buffer=b.nb;s.loop=true;f.type=type||'lowpass';f.frequency.value=fc;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(b.m);s.start(t);s.stop(t+dur+.05);
  }
  /* фон: медленные мягкие аккорды, каждый тянется восемь секунд и перетекает в следующий */
  function pad(b,t,notes,dur){
    notes.forEach(m=>[-5,6].forEach(det=>{const o=b.c.createOscillator(),g=b.c.createGain();o.type='triangle';o.frequency.value=hz(m);o.detune.value=det;
      g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.015,t+2.4);g.gain.setValueAtTime(.015,t+dur-.4);g.gain.linearRampToValueAtTime(.0001,t+dur+2.6);
      o.connect(g);g.connect(b.padf);o.start(t);o.stop(t+dur+2.7);}));
  }
  function bass(b,t,m,dur){
    const o=b.c.createOscillator(),g=b.c.createGain();o.type='triangle';o.frequency.value=hz(m);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.045,t+.25);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(b.padf);o.start(t);o.stop(t+dur+.05);
  }
  /* фа, до, ля минор, соль: круг из четырёх аккордов по восемь секунд */
  const CH=[{p:[53,57,60,64],b:41},{p:[55,59,60,64],b:48},{p:[55,57,60,64],b:45},{p:[55,59,62,64],b:43}],STEP=.5;
  /* один шаг музыки (восьмая доля): аккорд в начале, бас, редкие ноты мелодии случайной прогулкой */
  function musStep(b,t,s){
    const bar=((s%64)/16)|0,k=s%16;
    if(k===0){pad(b,t,CH[bar].p,8);bass(b,t,CH[bar].b,3.6);}
    if(k===8)bass(b,t,CH[bar].b,3);
    const p=k%4===0?.5:k%2===0?.28:.1;
    if(!b.rest&&Math.random()<p){b.deg=Math.max(3,Math.min(11,b.deg+[-2,-1,-1,1,1,2][(Math.random()*6)|0]));pluck(b,t+Math.random()*.012,note(b.deg),.045+Math.random()*.03);}
    if(k===15)b.rest=Math.random()<.25;
  }
  function tick(){
    if(mode<2||!ac||ac.state!=='running')return;
    if(nextT<ac.currentTime)nextT=ac.currentTime+.08;
    while(nextT<ac.currentTime+.7){musStep(B,nextT,stepN++);nextT+=STEP;}
  }
  const S={
    pick:(b,t)=>blip(b,t,520,640,.045,.06),
    turn:(b,t)=>{blip(b,t,470,600,.05,.06);blip(b,t+.045,600,540,.04,.035);},
    drop:(b,t)=>{blip(b,t,170,72,.13,.26);hiss(b,t,.08,.07,1100);},
    back:(b,t)=>blip(b,t,280,200,.09,.05),
    merge:(b,t,st,combo)=>{const n=5+((st||2)-2)*2+((combo||1)-1)*2;pluck(b,t,note(n),.2);pluck(b,t+.07,note(n+2),.13);if(st>=3)pluck(b,t+.14,note(n+4),.1);},
    lotus:(b,t)=>{[5,7,9,10,12,14].forEach((n,i)=>pluck(b,t+i*.075,note(n),.15));bell(b,t+.3,hz(note(14)),.05,2.2);},
    clear:(b,t)=>{for(let i=0;i<8;i++)pluck(b,t+i*.05,note(8+i),.1);},
    level:(b,t)=>{pluck(b,t,note(7),.11);pluck(b,t+.13,note(9),.11);pluck(b,t+.26,note(12),.1);},
    over:(b,t)=>{pluck(b,t,note(7),.14);pluck(b,t+.32,note(5),.14);pluck(b,t+.68,note(2),.13);},
    dig:(b,t)=>{blip(b,t,130,60,.12,.2);hiss(b,t+.03,.14,.06,650);},
    ui:(b,t)=>blip(b,t,700,700,.02,.035)
  };
  function bedOn(){
    if(!wet||(VIEW&&VIEW.big)||bed||!ac||ac.state!=='running')return;
    const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=B.nb;s.loop=true;f.type='bandpass';f.frequency.value=2600;f.Q.value=.6;g.gain.value=.025;
    s.connect(f);f.connect(g);g.connect(B.m);s.start();bed=s;
  }
  function wake(){bedOn();clearInterval(musT);musT=0;if(mode===2){musT=setInterval(tick,200);tick();}}
  /* held: игра на паузе (реклама, скрытая вкладка) — звук не просыпается ни от хода, ни от нажатия */
  let held=false;
  function ensure(){
    if(!mode||held)return false;
    if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;try{ac=new C();B=build(ac);}catch(e){ac=null;return false;}}
    if(ac.state==='suspended')ac.resume().then(wake).catch(()=>{});
    return true;
  }
  return {
    get mode(){return mode;},
    play(name,a,b){if(!ensure()||ac.state!=='running')return;try{S[name](B,ac.currentTime+.004,a,b);}catch(e){}},
    unlock(){if(ensure()&&ac.state==='running'&&!musT)wake();},
    retheme(){},
    toggle(){mode=mode?0:2;try{localStorage.setItem('orangery-snd2',String(mode));}catch(e){}
      if(!mode){clearInterval(musT);musT=0;if(ac)ac.suspend().catch(()=>{});}
      else if(ensure()&&ac.state==='running')wake();
      return mode;},
    hidden(h){held=!!h;if(!ac)return;if(h)ac.suspend().catch(()=>{});else if(mode)ac.resume().then(wake).catch(()=>{});},
    /* проверка без динамиков: звуки и 32 секунды музыки считаются в память, возвращаются пик и средняя громкость */
    async test(){
      const C=window.OfflineAudioContext||window.webkitOfflineAudioContext,out={},meas=d=>{let pk=0,sq=0,bad=0;for(let i=0;i<d.length;i++){const v=Math.abs(d[i]);if(!(v>=0))bad++;if(v>pk)pk=v;sq+=v*v;}return [+pk.toFixed(3),+Math.sqrt(sq/d.length).toFixed(4),bad];};
      for(const name of Object.keys(S)){const oc=new C(1,44100*3,44100),b=build(oc);S[name](b,.01,3,2);out[name]=meas((await oc.startRendering()).getChannelData(0));}
      const oc=new C(1,44100*34,44100),b=build(oc);for(let s=0;s<64;s++)musStep(b,.05+s*STEP,s);out.music=meas((await oc.startRendering()).getChannelData(0));
      return out;
    }
  };
})();

/* ---------- площадка: всё общение с Яндекс Играми идёт через этот слой; без SDK он молчит ---------- */
const PF=(()=>{
  /* y появляется, когда SDK ответил; желаемое состояние (готовность, идёт ли игра) запоминается и применяется, даже если он ответил поздно */
  let y=null,wantReady=false,readyDone=false,wantPlay=null,gp=null,pauseFn=null;
  const WAIT=4000,GAP=3000,LAZY=5000,RETRY=15000,TRIES=5;
  /* облако: пока оно в этом сеансе не прочитано успешно (cloudOk), в него ничего не пишется */
  let player=null,cloudOk=false,locked=false,sdkFn=null,cloudFn=null,tries=0,src=null,dirty=false,lastSent=0,timer=0,timerAt=0;
  async function readCloud(){
    if(!player)player=await y.getPlayer();
    const d=await player.getData();
    cloudOk=true;
    return d;
  }
  /* чтение не удалось или опоздало: повторяем в фоне и отдаём результат игре, когда он придёт */
  function retryCloud(){
    if(!y||cloudOk||tries>=TRIES)return;
    tries++;
    setTimeout(()=>{readCloud().then(d=>{if(cloudFn)cloudFn(d);},retryCloud);},RETRY);
  }
  /* один показ рекламы за раз: повторный вызов, пока первый не закончен, получает тот же результат.
     Без сети SDK молчит, поэтому показ даже не начинается. Если площадка не ответила за patience мс, игра отпускается,
     но опоздавшие ответы не теряются: поздно открывшаяся реклама всё равно ставит паузу, а досмотренный ролик отдаёт награду через lateFn.
     LIMIT: предел на случай, если реклама открылась, а о закрытии площадка так и не сообщила */
  const LIMIT=180000,NONE={shown:false,opened:false,rewarded:false};
  let adBusy=null,lateFn=null;
  function adv(method,patience){
    if(adBusy)return adBusy;
    if(!y||!y.adv||typeof y.adv[method]!=='function'||navigator.onLine===false)return Promise.resolve(NONE);
    const p=new Promise(res=>{
      let opened=false,held=false,rewarded=false,settled=false,closed=false,guard=0;
      const hold=v=>{if(held===v)return;held=v;if(pauseFn)pauseFn(v,'ad');};
      /* settle: игра получает ответ. close: реклама ушла с экрана */
      const settle=shown=>{if(settled)return;settled=true;res({shown:!!shown,opened,rewarded});};
      const close=shown=>{if(closed)return;closed=true;clearTimeout(guard);const late=settled;hold(false);settle(shown);if(late&&rewarded&&lateFn)lateFn();};
      guard=setTimeout(()=>{if(!opened)settle(false);},patience);
      try{
        y.adv[method]({callbacks:{
          onOpen(){if(closed)return;opened=true;hold(true);clearTimeout(guard);guard=setTimeout(()=>close(true),LIMIT);},
          onRewarded(){rewarded=true;},
          onClose(wasShown){close(wasShown!==false&&opened);},
          onError(){setTimeout(()=>{if(!opened)close(false);},300);}
        }});
      }catch(e){close(false);}
    });
    adBusy=p;p.then(()=>{if(adBusy===p)adBusy=null;});
    return p;
  }
  function plan(delay){
    const at=Math.max(Date.now()+delay,lastSent+GAP);
    if(timer&&timerAt<=at)return;
    clearTimeout(timer);timerAt=at;timer=setTimeout(flush,Math.max(0,at-Date.now()));
  }
  function flush(){
    timer=0;timerAt=0;
    if(!dirty||!cloudOk||locked||!player||!src)return;
    dirty=false;lastSent=Date.now();
    let rec;try{rec=src();}catch(e){return;}
    try{Promise.resolve(player.setData(rec,true)).catch(()=>{dirty=true;plan(RETRY);});}catch(e){dirty=true;}
  }
  function adopt(sdk){
    y=sdk;api.on=true;
    try{api.lang=String(y.environment.i18n.lang||'ru');}catch(e){}
    try{y.on('game_api_pause',()=>{if(pauseFn)pauseFn(true,'pf');});y.on('game_api_resume',()=>{if(pauseFn)pauseFn(false,'pf');});}catch(e){}
    if(wantReady)api.ready();
    if(wantPlay!==null)api.play(wantPlay);
    api.pending=false;if(sdkFn)sdkFn();
  }
  const api={
    /* pending: SDK подключён к странице, но ещё не ответил */
    on:false,pending:false,lang:'ru',patience:{full:12000,rew:20000},
    /* никогда не отклоняется: если площадка молчит дольше WAIT, игра стартует без неё */
    init(){
      const Y=window.YaGames;
      if(!Y||typeof Y.init!=='function')return Promise.resolve({cloud:null});
      let cloud=null,late=false,p;
      api.pending=true;
      try{p=Promise.resolve(Y.init());}catch(e){p=Promise.reject(e);}
      p=p.then(adopt).then(readCloud).then(d=>{if(late){if(cloudFn)cloudFn(d);}else cloud=d;},()=>{if(y)retryCloud();else{api.pending=false;if(sdkFn)sdkFn();}});
      return Promise.race([p,new Promise(r=>setTimeout(r,WAIT))]).then(()=>{late=true;return {cloud};});
    },
    /* запись в облако: get отдаёт запись в момент отправки; now просит отправить сразу, но не чаще раза в GAP */
    push(get,now){src=get;dirty=true;if(cloudOk&&!locked&&player)plan(now?0:LAZY);},
    /* в облаке запись более новой сборки: в этом сеансе в него больше ничего не пишется */
    lock(){locked=true;},
    onSdk(fn){sdkFn=fn;},
    onLateReward(fn){lateFn=fn;},
    onCloud(fn){cloudFn=fn;},
    /* реклама между забегами: true, если её показали. Всегда завершается */
    fullscreen(){return adv('showFullscreenAdv',api.patience.full).then(r=>r.shown);},
    /* ролик за награду: rewarded досмотрен, closed закрыт раньше времени, error не открылся. Всегда завершается */
    rewarded(){return adv('showRewardedVideo',api.patience.rew).then(r=>r.rewarded?'rewarded':r.opened?'closed':'error');},
    ready(){wantReady=true;if(readyDone||!y)return;readyDone=true;try{const L=y.features&&y.features.LoadingAPI;if(L)L.ready();}catch(e){}},
    play(on){on=!!on;wantPlay=on;if(!y||gp===on)return;if(gp===null&&!on){gp=false;return;}gp=on;try{const g=y.features&&y.features.GameplayAPI;if(g){if(on)g.start();else g.stop();}}catch(e){}},
    onPause(fn){pauseFn=fn;}
  };
  return api;
})();

/* ---------- состояние ---------- */
const SHAPES=[[[0,0]],[[0,0],[1,0]],[[0,0],[1,0],[0,1]]];
let grid,tray,score,best=0,busy,over,modal=null,tut=null,drag=null,pend=null,gv=0,grnd=Math.random,queue=Promise.resolve();
/* booted: данные игрока прочитаны и забег на экране. pauseWhy: кто поставил паузу (площадка, реклама, скрытая вкладка) */
let booted=false,paused=false;const pauseWhy={};
/* реклама: adCans сколько леек за ролик взято в этом забеге, adFails отказы ролика подряд, lastAdAt когда был последний показ между забегами */
let adCans=0,adFails=0,lastAdAt=0,adWait=false,adKind=null;
/* acted: игрок сделал в этом сеансе хоть что-то, что меняет забег (ход, замена лейкой, новый забег, вход в семя дня, обучение) */
let acted=false;const ACTS=['again','giveup','dplay','free','begin','retut','skip','restart','adcan','adno'];
const adState=()=>({on:PF.on,tut:!!tut,mode,adCans,fails:adFails,lastAdAt,hasEmpty:!!grid&&grid.some(t=>!t)});
/* переход между забегами: сначала реклама, если ей пора, потом следующий забег. Отказ площадки ничего не задерживает */
async function between(next){
  if(adWait)return;
  if(!PURE.adGate(adState(),Date.now())){next();return;}

/* ---------- цели забега: небольшие задачи, за каждую лейка; выполненную сменяет новая, труднее.
   Целей до трёх: вторая открывается на второй ступени, третья на третьей. Закрытая ячейка — null. В семени дня все три с первого хода ---------- */

function newGoal(slot,pool){
  /* выбор цели зависит от зерна забега и её порядкового номера: в семени дня цели одинаковы у всех */
  const R=seeded(seedOf()^Math.imul(gIssued+7,40503));gIssued++;
  const busyT=goals.map((g,i)=>i!==slot&&g?g.type:null),was=goals[slot]&&goals[slot].type;
  /* без явного списка цель берётся из того, что открыто на этой ступени */
  pool=pool||PURE.goalPool(stg());
  const free=t=>busyT.indexOf(t)<0&&t!==was,opts=pool.filter(free),rest=GTYPES.filter(free),list=opts.length?opts:rest.length?rest:pool;
  const type=list[(R()*list.length)|0],tb=GT[type];
  let n=tb[Math.min(gTier[type]||0,tb.length-1)];
  if(type==='score')n=tb.find(v=>v>=score+150)||Math.ceil(score*1.4/500)*500;

}

   недоигранный забег с другого устройства продолжается, пройденное обучение не показывается заново. Иначе идущий забег остаётся */

    /* гербарий слит с облаком: старый снимок его бы затёр, поэтому шаг назад после слияния недоступен */
    applyRec(m);best=m.best;loadHerb();renderHerbBtn();loadDaily();setBest();renderSeed();undoRec=null;renderLabel();
  }

/* читает сохранения из хранилища и ставит на экран то, что в них лежит: рекорд, гербарий, семя дня, обучение или недоигранный забег */
function restore(){
  const q=quiet;quiet=true;

  if(seen&&!LS.get('orangery-stages'))put('orangery-stages',[2,3,4,5]);

    const d=savedRun&&loadRun(savedRun);if(d){store('orangery-run',savedRun);resume(d);}

/* досмотренный ролик, о котором площадка сообщила слишком поздно: инструмент, который просили, всё равно выдаётся, если забег ещё идёт */

let preCloud=null;

/* сохранённое читается с проверкой: испорченная запись просто отбрасывается */

    const one=(s,set)=>typeof s==='string'&&s.length===1&&set.indexOf(s)>=0;

    const okPiece=q=>!!q&&Array.isArray(q.cells)&&q.cells.length>=1&&q.cells.length<=3&&q.cells.every(c=>Array.isArray(c)&&c.length===4&&[0,1,2].indexOf(c[0])>=0&&[0,1,2].indexOf(c[1])>=0&&((one(c[2],'ryb')&&(c[3]===1||c[3]===2))||(c[2]==='g'&&c[3]===0)));

/* ---------- семя дня: одна и та же раздача для всех, одна попытка, серия дней ---------- */

const today=()=>{const d=new Date(),z=v=>String(v).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());};

/* два варианта замены запоминаются за фигурой: отмена бесплатна, но перебирать варианты нельзя */
function altsFor(p){
  /* варианты замены зависят от зерна забега и номера фигуры, а не от случая: в семени дня они одинаковы у всех */
  const R=seeded(seedOf()^Math.imul((p.id|0)+1,-1640531535));
  /* лейка должна выручать: если ни один вариант не помещается, первый становится одной клеткой.
     Запомненные варианты перепроверяются при каждом открытии: грядка с тех пор могла измениться, а на «лейка спасёт» опираются правила тупика */
  const fix=out=>{
    if(!out.some(fitsAny)){const pool=(mode==='daily'?dealt>=45:(score||0)>=1500)?['r','y','b']:['r','y'];out[0]=mkPiece([[0,0,pool[(R()*pool.length)|0],R()<.15?2:1]]);}
    return out;
  };
  if(p.alt)return fix(p.alt);
  const sig=q=>q.cells.map(c=>c[2]+c[3]).sort().join(''),seen={},out=[];seen[sig(p)]=1;
  for(let i=0;i<40&&out.length<2;i++){const q=newPiece(R);if(!seen[sig(q)]){seen[sig(q)]=1;out.push(q);}}
  while(out.length<2)out.push(newPiece(R));
  return p.alt=fix(out);
}

  }

/* ---------- перетаскивание ---------- */
function pt(e){const m=game.getScreenCTM();return {x:(e.clientX-m.e)/m.a,y:(e.clientY-m.f)/m.d};}
function moveDrag(e){
  const p=drag.p,q=pt(e),w=p.w*STEP-GAP,h=p.h*STEP-GAP;
  const x=q.x-w/2,y=q.y-(drag.touch?h+44:h/2);
  dragG.setAttribute('transform',`translate(${f1(x)},${f1(y)})`);
  const c=Math.round((x-BX)/STEP),r=Math.round((y-BY)/STEP);
  drag.c=c;drag.r=r;drag.ok=fits(p,c,r);
  /* над свободным местом фигура бледнеет, а грядка показывает, что получится после хода */
  dragG.style.opacity=drag.ok?.2:1;
  showPreview(p,c,r,drag.ok);
  look(q.x,y+h/2);par((q.x-195)/195,(q.y-422)/422);
}
function beginDrag(e){
  const s=pend;clearTimeout(s.timer);pend=null;
  drag={k:s.k,p:s.p,id:s.id,touch:s.touch,ok:false};
  renderTray();dragG.innerHTML=pieceHTML(s.p,CELL,GAP,true);SND.play('pick');markWant(s.p);
  const hand=$('hand');if(hand)hand.remove();
  moveDrag(e);
}
function endDrag(commit){
  if(!drag)return;
  const d=drag;drag=null;dragG.innerHTML='';dragG.style.opacity='';showPreview(null);markWant(null);look(null);par(0,0);
  try{game.releasePointerCapture(d.id);}catch(e){}
  if(commit&&d.ok){queue=queue.then(()=>{if(!over&&tray[d.k]===d.p&&fits(d.p,d.c,d.r))return place(d.k,d.p,d.c,d.r);renderTray();}).catch(()=>{busy=false;renderTray();});}
  else{SND.play('back');renderTray();if(tut)renderTut();}

/* короткое касание без сдвига поворачивает фигуру, сдвиг или задержка поднимают её */
game.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-slot]');
  if(!el||over||modal||drag||pend||paused||!booted)return;
  const k=+el.dataset.slot,p=tray[k];if(!p)return;
  e.preventDefault();
  if(dig)setDig(false);

  const q=pt(e);

  if(drag&&e.pointerId===drag.id){e.preventDefault();moveDrag(e);}

game.addEventListener('pointerup',e=>{

/* ---------- кнопки ---------- */
let armed=0;
function act(el){
  if(!el||paused||!booted)return;
  if(ACTS.indexOf(el.id)>=0||el.dataset.alt)acted=true;
  SND.play('ui');
  if(el.id==='again'){between(start);return;}
  if(el.id==='adcan'){watchCan();return;}
  if(el.id==='adno'){if(adWait)return;const k=adKind;closeCard();if(k==='stuck')gameOver();return;}
  if(el.id==='can'){
    if(busy||over||modal||drag||pend||(tut&&!(tut.phase==='do'&&TUT[tut.n].can)))return;
    if(!cans){if(PURE.canOffer(adState()))toolCard('can','empty');else toast('леек нет: их дают за лотос и цели');return;}
    if(dig){dig=false;renderDig();}
    openSwap();renderLabel();if(tut)renderTut();return;
  }
  if(el.id==='shovel'){
    if(busy||over||modal||drag||pend||tut)return;
    if(!shovels){if(PURE.adOpen(adState()))toolCard('shovel','empty');else toast('лопатку дают за цепочку слияний');return;}
    setDig(!dig);return;
  }
  if(el.id==='undo'){
    if(undoRec)undo();else if(!busy&&!over&&!modal&&!tut)toast('отменять пока нечего');
    return;
  }
  if(el.id==='giveup'){
    /* ссылка стоит вплотную к отмене, а конец забега не вернуть: первое нажатие спрашивает «точно?», как у кнопки «заново» */
    if(busy||over||modal)return;
    if(Date.now()<giveArm){giveArm=0;stuck=false;gameOver();return;}
    const t=el.querySelector('text');if(t)t.textContent='точно?';
    giveArm=Date.now()+2500;
    setTimeout(()=>{if(giveArm&&Date.now()>=giveArm)renderLabel();},2600);
    return;
  }
  if(el.dataset.tab){openSwap(+el.dataset.tab,true);return;}
  if(el.id==='keep'){closeCard();swap=false;renderLabel();if(tut)renderTut();return;}
  if(el.dataset.alt){
    if(busy||drag||pend)return;
    const p=tray[swapK],q=p&&p.alt&&p.alt[+el.dataset.alt];closeCard();swap=false;
    /* у фигуры, которую поставила лейка, свой номер: от него зависят уже её варианты замены */
    if(q){undoMark('swap');q.id=((((p.id|0)*31+1000+(+el.dataset.alt))>>>0)%1000000007);tray[swapK]=q;cans--;SND.play('level');buzz(10);}
    renderLabel();renderTray(true);
    if(tut){tutDone();return;}
    save();checkEnd();return;
  }
  if(el.id==='snd'){SND.toggle();sndIcon();toast(sndName(SND.mode));return;}
  if(el.id==='share'){share(el);return;}
  if(el.id==='gfx'){lite=!lite;try{localStorage.setItem('orangery-lite',lite?'1':'0');}catch(e){}scr.classList.toggle('lite',lite);stage.classList.toggle('lite',lite);par(0,0);resize();rules();return;}
  if(el.id==='stageok'){closeCard();stageCard();return;}
  if(el.id==='play'||el.id==='ok'||el.id==='dclose'||el.id==='xclose'){closeCard();return;}
  if(el.id==='rnext'){rules(1);return;}
  if(el.id==='herb'){if(!busy&&!drag&&!tut&&!over&&!modal)herbCard();return;}
  if(el.dataset.herb){herbCard(el.dataset.herb,true);return;}
  if(el.dataset.goal){if(!busy&&!drag&&!over&&!modal&&goals)goalsCard();return;}
  if(el.id==='seed'){if(!busy&&!drag&&!tut&&!over&&(!modal||modal==='daily'))dailyCard();return;}
  if(el.id==='dplay'){startDaily();return;}
  if(el.id==='free'){between(exitDaily);return;}
  if(el.id==='begin'){tutStart();return;}
  if(el.id==='help'){if(!over&&!modal&&!drag)rules();return;}
  if(el.id==='retut'){if(!busy)tutStart();return;}
  if(el.id==='skip'){if(tut&&!busy){tutFinish();start();}return;}
  if(el.dataset.theme){manual=true;setTheme(el.dataset.theme,true);return;}
  if(el.id==='restart'){
    if(busy||tut)return;
    if(mode==='daily'){if(daily.done)between(exitDaily);else exitDaily();return;}
    const t=$('restart-t');
    if(over){armed=0;t.textContent='заново';between(start);return;}
    if(score===0||Date.now()<armed){armed=0;t.textContent='заново';start();return;}
    armed=Date.now()+2500;t.textContent='точно?';
    setTimeout(()=>{if(armed&&Date.now()>=armed){armed=0;t.textContent='заново';}},2600);
  }
}

function boot(env){
  try{
    /* облачная копия сливается с местной до того, как игра прочитает сохранения */
    const cloud=(env&&env.cloud)||preCloud;
    if(PURE.foreign(cloud))PF.lock();
    else if(cloud)applyRec(PURE.mergeSaves(localRec(),cloud,okRun));
    /* иногда идёт дождь; #rain в адресе включает его наверняка */
    wet=location.hash==='#rain'||(LS.get('orangery-tut')==='1'&&Math.random()<.18);
    if(wet)setTheme(themeId);
    renderLabel();
    restore();
  }catch(e){
    /* что бы ни случилось с сохранениями, игрок получает пустой забег, а площадка — сигнал готовности */
    try{console.error(e);mode='free';startRun();}catch(e2){}
  }
  /* сцена сама переходит к следующему времени суток, если его не выбрали вручную */
  setInterval(()=>{if(!manual){const t=themeByClock();if(t!==themeId)setTheme(t,true);}},60000);

  setInterval(()=>{

  },2800);
  /* игру можно трогать: сообщаем площадке о готовности и о том, идёт ли игра */
  booted=true;quiet=false;lastAdAt=Date.now();PF.ready();syncPlay();
  /* местная копия могла оказаться полнее облачной: отправляем слитую запись */
  if(PF.on)PF.push(localRec,false);
}
